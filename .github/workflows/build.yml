# Single-workflow build and deploy for ride.i-d-e.de — per
# specification.md N10 (one workflow file) and pipeline.md "GitHub Actions
# workflow (Phase 15)".
#
# The TEI corpus and schema live in this repo under issues/{N}/reviews/
# and schema/. Per-issue pictures still live in i-d-e/ride under
# issues/issue{NN}/{slug}/pictures/ and are pulled in via the asset pipeline.
# The picture sibling is checked out alongside so REPO_ROOT.parent / "ride"
# resolves at build time; when pictures move into this repo too, the second
# checkout can drop.
#
# Triggers:
#   - push to main (TEI corpus, content, pipeline code — see paths below)
#   - manual dispatch from the Actions tab
#   - repository_dispatch from the two companion repositories, whose pushes
#     do not reach this repo on their own: i-d-e/ride (picture updates)
#     fires `corpus-updated`, i-d-e/ride-editors (work in progress) fires
#     `editors-updated`. Each carries a one-file sender workflow;
#     templates and install steps live in docs/upstream-workflows/.

name: build

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "src/**"
      - "templates/**"
      - "static/**"
      - "config/**"
      - "content/**"
      - "issues/**"
      - "schema/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [corpus-updated, editors-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ride-static
        uses: actions/checkout@v4
        with:
          path: ride-static

      # Pictures still live in the i-d-e/ride sibling repo. The asset
      # pipeline reads them via REPO_ROOT.parent / "ride" / "issues" / ...
      # When pictures move into ride-static, drop this step.
      - name: Checkout ride pictures (sibling, pictures only)
        uses: actions/checkout@v4
        with:
          repository: i-d-e/ride
          path: ride

      - name: Checkout pinned TEI Stylesheets
        uses: actions/checkout@v4
        with:
          repository: TEIC/Stylesheets
          ref: a375bc8612ec1d0c98bed4f88a818ba68eeb62f6 # v7.60.0
          path: tei-stylesheets

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: ride-static/uv.lock

      - name: Setup Java for ODD compilation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install WeasyPrint system libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install dependencies
        working-directory: ride-static
        run: uv sync --locked

      - name: Verify ODD and Relax NG are synchronized
        working-directory: ride-static
        run: uv run python scripts/compile_schema.py --stylesheets ../tei-stylesheets --check

      - name: Lint Python
        working-directory: ride-static
        run: uv run ruff check .

      - name: Cache TEI P5 subset
        uses: actions/cache@v4
        with:
          path: ride-static/inventory/_cache
          key: p5subset-${{ hashFiles('ride-static/scripts/p5_fetch.py') }}

      - name: Run tests
        working-directory: ride-static
        run: uv run python -m pytest -q

      - name: Discovery scripts (Tier 1)
        working-directory: ride-static
        run: |
          uv run python scripts/inventory.py
          uv run python scripts/odd_extract.py
          uv run python scripts/structure.py
          uv run python scripts/sections.py
          uv run python scripts/ids.py
          uv run python scripts/refs.py
          uv run python scripts/taxonomy.py

      - name: Discovery scripts (Tier 2 + 3)
        working-directory: ride-static
        run: |
          uv run python scripts/p5_fetch.py
          uv run python scripts/cross_reference.py

      - name: Render knowledge docs (Tier 4)
        working-directory: ride-static
        run: |
          uv run python scripts/render_data.py
          uv run python scripts/render_schema.py

      - name: Build site
        working-directory: ride-static
        run: >-
          uv run python -m src.build
          --base-url=/${{ github.event.repository.name }}
          --include-drafts
          --pdf

      - name: Build draft preview artifact
        working-directory: ride-static
        run: >-
          uv run python -m src.build
          --output=draft-site
          --include-drafts
          --pdf
          --pdf-drafts-only

      - name: Build draft Pagefind index
        working-directory: ride-static
        run: npx -y pagefind --site draft-site

      - name: Upload draft preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: draft-review-preview
          path: ride-static/draft-site
          if-no-files-found: error
          retention-days: 7

      - name: Build Pagefind index
        working-directory: ride-static
        run: npx -y pagefind --site site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ride-static/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
