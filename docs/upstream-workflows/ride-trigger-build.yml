# Sender workflow for i-d-e/ride — install as
# .github/workflows/trigger-site-build.yml in that repository.
#
# i-d-e/ride holds the figure images for the published reviews. This
# workflow notifies ride-static when images change, so the site rebuilds
# and copies the new files in. Requires the secret
# RIDE_STATIC_DISPATCH_TOKEN (a fine-grained personal access token for
# i-d-e/ride-static with Contents: Read and write); see
# docs/upstream-workflows/README.md in ride-static.

name: trigger-site-build

on:
  push:
    branches: [master, main]
    paths:
      # Only the picture tree matters for the site build; the historic
      # tei_all/ and schema/ copies in this repository are no longer the
      # canonical source (they moved into ride-static in May 2026).
      - "issues/**"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Notify ride-static (corpus-updated)
        env:
          GH_TOKEN: ${{ secrets.RIDE_STATIC_DISPATCH_TOKEN }}
        run: gh api repos/i-d-e/ride-static/dispatches -f event_type=corpus-updated
