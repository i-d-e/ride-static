[project]
name = "ride-static"
version = "0.0.0"
description = "Static publication pipeline for the RIDE review journal"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "lxml>=5.0",
  "markdown>=3.5",
  "pyyaml>=6.0",
  "requests>=2.31",
  "weasyprint>=60.0",
  "wordcloud>=1.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff==0.15.21",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Initial true-error gate for the legacy codebase; broaden rules in staged cleanups.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
line-ending = "lf"
